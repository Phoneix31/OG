    <!-- Lightbox container for enlarged image viewing -->
    <div class="lightbox" id="lightbox">
      <!-- Close button for the lightbox -->

      <!-- Previous button for navigating images -->

      <!-- Lightbox image placeholder -->

      <!-- Next button for navigating images -->

  <!-- Inline JavaScript for lightbox functionality -->
  <script>
    // Get all gallery items
    const galleryItems = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxCaption = document.getElementById('lightbox-caption');
    let currentImageIndex = 0;

    // Add click event listeners to gallery items to open lightbox
    galleryItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentImageIndex = index;
        updateLightbox();
        lightbox.style.display = 'flex';
      });
    });

    // Function to update lightbox content with current image and caption
    function updateLightbox() {
      const item = galleryItems[currentImageIndex];
      const imgSrc = item.querySelector('img').src;
      const caption = item.getAttribute('data-caption');
      lightboxImage.src = imgSrc;
      lightboxCaption.textContent = caption;
    }

    // Function to change image (next/previous) with looping
    function changeImage(direction) {
      currentImageIndex += direction;
      if (currentImageIndex >= galleryItems.length) {
        currentImageIndex = 0; // Loop to first image
      } else if (currentImageIndex < 0) {
        currentImageIndex = galleryItems.length - 1; // Loop to last image
      }
      updateLightbox();
    }

    // Function to close the lightbox
    function closeLightbox() {
      lightbox.style.display = 'none';
    }

    // Close lightbox when clicking outside the image or on close button
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.classList.contains('lightbox-close')) {
        closeLightbox();
      }
    });

    // Close lightbox with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.style.display === 'flex') {
        closeLightbox();
      }
    });

    // Navigate with arrow keys
    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') {
          changeImage(1);
        } else if (e.key === 'ArrowLeft') {
          changeImage(-1);
        }
      }
    });
  </script>
  
  <!-- Include shared JavaScript file for mobile navigation toggle -->
  <script src="assets/js/scripts.js"></script>
