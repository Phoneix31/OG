<!-- Declare the document type as HTML5 -->
<!DOCTYPE html>

<!-- Define the HTML document with English as the primary language -->
<html lang="en">

<head>
  <!-- Specify UTF-8 character encoding for proper text rendering -->
  <meta charset="UTF-8">
  
  <!-- Ensure responsive design by setting viewport to device width and initial scale -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Set the page title displayed in the browser tab -->
  <title>Home - OG Photography</title>
  
  <!-- Link to the main stylesheet (styles.css) for homepage styling -->
  <link rel="stylesheet" href="assets/css/styles.css">
  
  <!-- Link to an additional stylesheet (responsive.css) for responsive design rules -->
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
  <!-- Header section, styled as a fixed navigation bar with a background image -->
  <header>
    <!-- Logo container with an image, styled to scale on hover -->
    <div class="logo">
      <img src="assets/images/logo.png" alt="OG Photography logo">
    </div>
    
    <!-- Hamburger menu toggle button for mobile navigation, hidden on larger screens -->
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <!-- Visual hamburger icon, styled to transform into an "X" when active -->
      <span class="hamburger"></span>
    </button>
    
    <!-- Navigation menu with links, styled as a horizontal list on desktop and dropdown on mobile -->
    <nav>
      <ul>
        <!-- Home link, marked as active for the current page -->
        <li><a href="index.html" class="active">HOME</a></li>
        <li><a href="blog.html">BLOG</a></li>
        <li><a href="info.html">INFO</a></li>
        <!-- Contact button styled with a teal background -->
        <li><a href="booknow.html" class="contact-btn-nav">BOOK NOW</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content area for the homepage -->
  <main>
    <!-- Hero section for the main banner -->
    <section class="hero">
      <!-- Inner container for hero content -->
      <div class="hero-inner">
        <!-- Logo displayed in the hero section, reusing the same logo image -->
        <img src="assets/images/logo.png" alt="OG Photography Logo" class="hero-logo">
        
        <!-- Subtitle emphasizing the brand's value proposition -->
        <p class="hero-subtitle">Where we make your most valuable memories last forever</p>
      </div>
    </section>
    
    <!-- Portfolio section showcasing photography categories -->
    <section class="portfolio-section">
      <!-- Birthday portfolio item -->
      <div class="portfolio-item birthday">
        <h2>BIRTHDAY</h2>
        <!-- Link to the birthday portfolio page -->
        <a href="portfolio-birthday.html" class="portfolio-btn-birthday">VIEW PORTFOLIO</a>
      </div>
      
      <!-- Wedding portfolio item -->
      <div class="portfolio-item wedding">
        <h2>WEDDING</h2>
        <!-- Link to the wedding portfolio page -->
        <a href="portfolio-wedding.html" class="portfolio-btn-wedding">VIEW PORTFOLIO</a>
      </div>

      <!-- Couples portfolio item -->
      <div class="portfolio-item couples">
        <h2>COUPLES</h2>
        <!-- Link to the couples portfolio page -->
        <a href="portfolio-couple.html" class="portfolio-btn-couples">VIEW PORTFOLIO</a>
      </div>
    </section>
  </main>

  <!-- Footer with contact info, copyright, and location, styled with a gradient background -->
  <footer>
    <p>Email: mohmaede31@gmail.com</p>
    <p><em>Copyright © 2025 OG Photography. All Rights Reserved.</em></p>
    <p>Moorhead, MN - Fargo, ND</p>
  </footer>
  
  <!-- Include JavaScript file for shared functionality (e.g., mobile nav toggle) -->
  <script src="assets/js/scripts.js"></script>
</body>
</html>
